<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AGZ 融合定位轨迹回放</title>
<style>body{margin:0;background:#f3f5f8;color:#142238;font:16px system-ui,"Microsoft YaHei",sans-serif}main{max-width:1100px;margin:30px auto;padding:24px;background:white;border-radius:16px}h1{font-size:26px;margin:0 0 10px}p{color:#526175;line-height:1.6}canvas{display:block;width:100%;height:540px;background:#fbfcfe;border:1px solid #d8e0ea;border-radius:10px}footer{display:flex;gap:16px;align-items:center;margin-top:18px;flex-wrap:wrap}button,select{padding:8px 16px;border:1px solid #c4d0dc;border-radius:6px;background:white;color:#142238}input{flex:1;min-width:200px}#legend{display:flex;gap:20px;margin:14px 0;flex-wrap:wrap}.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px}#status{font-variant-numeric:tabular-nums}</style>
<main><h1>GPS 中断 5 秒时的轨迹回放</h1><p>比较单 GPS、固定融合和自适应抗异常融合。黑色虚线为摄影测量参考轨迹；中断发生在片段第 20—25 秒。此回放呈现人工注入的实验场景。</p><div id="legend"></div><canvas id="plot"></canvas><footer><button id="play">播放</button><input id="slider" type="range" min="0" max="60" step="0.1" value="0"><span id="status"></span><select id="speed"><option value="1">1×</option><option value="2">2×</option><option value="5">5×</option></select></footer></main>
<script>
const data=__DATA__,canvas=document.querySelector('#plot'),ctx=canvas.getContext('2d'),slider=document.querySelector('#slider');
const palette=['#8b949e','#d17a28','#117c83','#8457b5'];let running=false,last=null,time=0;
const names=Object.keys(data.methods),series=names.map(n=>data.methods[n]),t0=series[0][0][0],end=series[0].at(-1)[0]-t0;
slider.max=end;document.querySelector('#legend').innerHTML='<span><i class="dot" style="background:#17202a"></i>参考轨迹</span>'+names.map((n,i)=>`<span><i class="dot" style="background:${palette[i]}"></i>${n}</span>`).join('');
const points=[...data.truth,...series.flat()];let xmin=Math.min(...points.map(p=>p[1])),xmax=Math.max(...points.map(p=>p[1])),ymin=Math.min(...points.map(p=>p[2])),ymax=Math.max(...points.map(p=>p[2]));
function draw(){const dpr=devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);const scale=Math.min((w-100)/Math.max(1,xmax-xmin),(h-90)/Math.max(1,ymax-ymin));const cx=(xmin+xmax)/2,cy=(ymin+ymax)/2;function xy(p){return[w/2+(p[1]-cx)*scale,h/2-(p[2]-cy)*scale]};ctx.strokeStyle='#e5ebf2';ctx.lineWidth=1;for(let x=55;x<w-30;x+=65){ctx.beginPath();ctx.moveTo(x,35);ctx.lineTo(x,h-45);ctx.stroke()}for(let y=35;y<h-45;y+=65){ctx.beginPath();ctx.moveTo(55,y);ctx.lineTo(w-30,y);ctx.stroke()}ctx.fillStyle='#526175';ctx.font='13px system-ui';ctx.fillText('North / 北 (m)',20,22);ctx.fillText('East / 东 (m)',w-125,h-15);ctx.fillText(`范围 E ${xmin.toFixed(1)}…${xmax.toFixed(1)} m；N ${ymin.toFixed(1)}…${ymax.toFixed(1)} m`,60,h-15);
function path(rows,color,dashed=false){ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=dashed?1.8:2.4;ctx.setLineDash(dashed?[5,5]:[]);rows.forEach((p,i)=>{const[x,y]=xy(p);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ctx.setLineDash([])}path(data.truth,'#17202a',true);series.forEach((rows,i)=>{const visible=rows.filter(p=>p[0]<=t0+time+1e-7);path(visible,palette[i]);if(visible.length){const[x,y]=xy(visible.at(-1));ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fillStyle=palette[i];ctx.fill()}});document.querySelector('#status').textContent=`${time.toFixed(1)} / ${end.toFixed(1)} 秒`+(time>=20&&time<25?' · GPS 中断':'');slider.value=time}
document.querySelector('#play').onclick=()=>{if(time>=end)time=0;running=!running;last=null;document.querySelector('#play').textContent=running?'暂停':'播放'};slider.oninput=()=>{time=Number(slider.value);draw()};window.onresize=draw;
function frame(stamp){if(running){if(last!==null)time=Math.min(end,time+(stamp-last)/1000*Number(document.querySelector('#speed').value));last=stamp;if(time>=end){running=false;document.querySelector('#play').textContent='播放'}draw()}requestAnimationFrame(frame)}draw();requestAnimationFrame(frame);
</script></html>
